<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../assets/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <title>Dashboard | Mi Sistema</title>
    <style>
        .dashboard-page {
            min-height: calc(100vh - 64px);
            color: #1a202c;
        }

        .quick-link {
            border: 1px solid #d9e2ec;
            background: #ffffff;
            color: #344054;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .quick-link:hover {
            border-color: var(--color-principal);
            box-shadow: 0 8px 18px rgba(56, 161, 105, 0.14);
            color: #1f2937;
            transform: translateY(-1px);
        }

        .dashboard-main-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.7fr) minmax(300px, 0.8fr);
            gap: 24px;
            align-items: stretch;
        }

        .dashboard-section {
            background: #ffffff;
            border: 1px solid #e8edf3;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 22px;
            border-bottom: 1px solid #edf2f7;
        }

        .section-title {
            /* font-size: 18px;
            font-weight: 750;
            color: #1a202c; */

            font-size: 17px;
            color: #718096;
            font-weight: 500;            
        }

        .section-note {
            color: #718096;
            font-size: 13px;
            white-space: nowrap;
        }

        .chart-panel {
            min-height: 360px;
        }

        .chart-container {
            height: 300px;
            padding: 22px;
            position: relative;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            padding: 18px;
        }

        .quick-link {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 58px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            text-align: left;
        }

        .quick-link i {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: rgba(56, 161, 105, 0.1);
            color: var(--color-principal);
            flex: 0 0 auto;
        }

        @media (max-width: 1100px) {
            .dashboard-main-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .contenedor {
                padding: 18px;
            }

            .cards-grid,
            .quick-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 260px;
                padding: 16px;
            }

            .section-header {
                padding-left: 16px;
                padding-right: 16px;
            }

            .section-note {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main class="contenedor dashboard-page">
        <nav id="breadcrumb" class="breadcrumb" aria-label="Ruta de navegacion"></nav>

        <section class="cards-grid" aria-label="Metricas principales">
            <article class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">Total clientes</span>
                    <div class="stat-card-icon icon-purple"><i class="fa-solid fa-users"></i></div>
                </div>
                <div class="stat-value">8</div>
                <div class="stat-change positive"><i class="fa-solid fa-arrow-up"></i> 12% desde el mes pasado</div>
            </article>

            <article class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">Total Proveedores</span>
                    <div class="stat-card-icon icon-green"><i class="fa-solid fa-truck-fast"></i></div>
                </div>
                <div class="stat-value">12</div>
                <div class="stat-change positive"><i class="fa-solid fa-arrow-up"></i> 8% desde el mes pasado</div>
            </article>

            <article class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">Productos activos</span>
                    <div class="stat-card-icon icon-orange"><i class="fa-solid fa-boxes-stacked"></i></div>
                </div>
                <div class="stat-value">567</div>
                <div class="stat-change positive"><i class="fa-solid fa-arrow-up"></i> 5% desde el mes pasado</div>
            </article>

            <article class="stat-card">
                <div class="stat-card-header">
                    <span class="stat-card-title">Pedidos pendientes</span>
                    <div class="stat-card-icon icon-red"><i class="fa-solid fa-p"></i></div>
                </div>
                <div class="stat-value">23</div>
                <div class="stat-change negative"><i class="fa-solid fa-arrow-down"></i> 3% desde el mes pasado</div>
            </article>
        </section>

        <section class="dashboard-main-grid">
            <div class="dashboard-section chart-panel">
                <div class="section-header">
                    <h2 class="section-title">Ventas mensuales</h2>
                    <span class="section-note">Comparativo mensual</span>
                </div>
                <div class="chart-container">
                    <canvas id="salesLineChart" aria-label="Grafico de lineas de ventas mensuales"></canvas>
                </div>
            </div>

            <aside class="dashboard-section">
                <div class="section-header">
                    <h2 class="section-title">Acciones rapidas</h2>
                    <span class="section-note">Atajos</span>
                </div>
                <div class="quick-grid">
                    <button type="button" class="quick-link" data-route-key="7P9Q1R3"><i class="fa-solid fa-user-plus"></i>Clientes</button>
                    <button type="button" class="quick-link" data-route-key="6B8C0D2"><i class="fa-solid fa-box-open"></i>Productos</button>
                    <button type="button" class="quick-link" data-route-key="7LOQ1G2"><i class="fa-solid fa-sliders"></i>Definiciones</button>
                    <button type="button" class="quick-link" data-route-key="3S5T7V9"><i class="fa-solid fa-user-gear"></i>Usuarios</button>
                </div>
            </aside>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const routePaths = {
            '7P9Q1R3': '../cliente/cliente.html',
            '6B8C0D2': '../producto/producto.html',
            '7LOQ1G2': '../configuraciones/definiciones/definiciones.html',
            '3S5T7V9': '../configuraciones/usuarios/usuarios.html'
        };

        function goToRoute(key) {
            try {
                const parentOption = window.parent.document.querySelector(`.option[data-key="${key}"]`);
                if (parentOption) {
                    parentOption.click();
                    return;
                }
            } catch (error) {
                console.warn('No se pudo navegar desde el contenedor principal:', error);
            }

            if (routePaths[key]) {
                window.location.href = routePaths[key];
            }
        }

        function initSalesChart() {
            const canvas = document.getElementById('salesLineChart');
            if (!canvas || typeof Chart === 'undefined') {
                return;
            }

            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 280);
            gradient.addColorStop(0, 'rgba(56, 161, 105, 0.24)');
            gradient.addColorStop(1, 'rgba(56, 161, 105, 0)');

            new Chart(canvas, {
                type: 'line',
                data: {
                    labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
                    datasets: [
                        {
                            label: 'Ventas 2026',
                            data: [9, 11, 10, 12, 13, 12, 14, 15, 14, 16, 16, 17],
                            borderColor: '#38a169',
                            backgroundColor: gradient,
                            borderWidth: 3,
                            pointBackgroundColor: '#ffffff',
                            pointBorderColor: '#38a169',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            fill: true,
                            tension: 0.38
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            align: 'end',
                            labels: {
                                boxWidth: 10,
                                boxHeight: 10,
                                color: '#4a5568',
                                font: {
                                    size: 12,
                                    weight: '600'
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: (context) => `${context.dataset.label}: Cantidad ${context.parsed.y}`
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#718096',
                                font: {
                                    size: 12
                                }
                            }
                        },
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(226, 232, 240, 0.9)'
                            },
                            ticks: {
                                color: '#718096',
                                callback: (value) => `${value}`, //aca se quita el M del lateral
                                font: {
                                    size: 12
                                }
                            }
                        }
                    }
                }
            });
        }

        document.querySelectorAll('[data-route-key]').forEach((button) => {
            button.addEventListener('click', () => goToRoute(button.dataset.routeKey));
        });

        window.addEventListener('load', initSalesChart);
    </script>
</body>
</html>
