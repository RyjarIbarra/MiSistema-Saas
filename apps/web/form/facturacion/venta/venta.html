    <link rel="stylesheet" href="../../../css/style.css">
    <title>Facturacion Venta - Mi Sistema</title>
</head>
<body>

        <section class="venta-grid">

            <div class="venta-card">
                <div class="venta-card-header">
                    <h2 class="venta-card-title">Datos del comprobante</h2>
                </div>
                <div class="venta-card-body">
                    <form id="ventaForm">
                        <div class="row mb-2">
                            <div class="col-2" style="padding-right: unset;">
                                <label for="fecha">Fecha *</label>
                                <input type="date" id="fecha" class="form-control input-estilizado" data-required="true">
                            </div>    
                            <div class="col-2" style="padding-right: unset;">
                                <label for="sucursalId">Sucursal *</label>
                                <select id="sucursalId" class="form-select input-estilizado" data-required="true">
                                    <option value="">Seleccionar...</option>
                                </select>
                            </div>      
                            <div class="col-2" style="padding-right: unset;">
                                <label for="comprobanteId">Tipo Documento *</label>
                                <select id="comprobanteId" class="form-select input-estilizado" data-required="true">
                                    <option value="FAC">Factura</option>
                                    <option value="NCR">Nota de Crédito</option>
                                </select>
                            </div>                                                  
                            <div class="col-2" style="padding-right: unset;">
                                <label for="nroComprobante">Nro. Comprobante</label>
                                <input type="text" id="nroComprobante" class="form-control input-estilizado" value="" placeholder="Se genera al emitir" autocomplete="off" readonly>
                            </div>  
                            <div class="col-2" style="padding-right: unset;">
                                <label for="nroTimbrado">Timbrado *</label>
                                <input type="text" id="nroTimbrado" class="form-control input-estilizado" value="" autocomplete="off" readonly>
                            </div>                                                                                                
                        </div>
                        <div class="row mb-2">
                            <div class="col-2" style="padding-right: unset;">
                                <label for="clienteRuc">RUC/CI *</label>
                                <input type="text" id="clienteRuc" class="form-control input-estilizado" placeholder="RUC" autocomplete="off" data-required="true">
                            </div>
                            <div class="col-4" style="padding-right: unset;">
                                <label for="clienteNombre">Cliente *</label>
                                <input type="text" id="clienteNombre" class="form-control input-estilizado" placeholder="Nombre del cliente" autocomplete="off" data-required="true" readonly>
                            </div>
                            <div class="col-2" style="padding-right: unset;">
                                <label for="condicion">Condicion *</label>
                                <select id="condicion" class="form-select input-estilizado" data-required="true">
                                    <option value="CONTADO">Contado</option>
                                    <option value="CREDITO">Credito</option>
                                </select>
                            </div>          
                            <div class="col-2" style="padding-right: unset;">
                                <label for="moneda">Moneda *</label>
                                <select id="moneda" class="form-select input-estilizado" data-required="true">
                                    <option value="PYG">Guarani</option>
                                    <option value="USD">Dolar</option>
                                </select>
                            </div>                             
                        </div>
                        <!-- <div class="row">
                            <div class="col-2" style="padding-right: unset;">

                    </form>
                </div>
            </div>

        </section>

        <section class="venta-card venta-table-card">
            <div class="venta-card-header">
                <form id="detalleForm" class="venta-product-row">
                    <div>
                        <label for="codigo">Codigo *</label>
                        <input type="text" id="codigo" class="form-control input-estilizado" data-required="true" autocomplete="off">
                    </div>                    
                    <div>
                        <label for="producto">Producto *</label>
                        <input type="text" id="producto" class="form-control input-estilizado" autocomplete="off" data-required="true" readonly>
                    </div>
                    <div>
                        <label for="cantidad">Cantidad *</label>
                        <input type="text" id="cantidad" class="form-control input-estilizado" data-required="true" autocomplete="off">
                    </div>
                    <div>
                        <label for="precio">Precio *</label>
                        <select id="precio" class="form-select input-estilizado" data-required="true">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                    <button type="button" class="btn-primary" id="btnAgregarItem">
                        <i class="fa-solid fa-plus"></i> Agregar
                    </button>
                </form>                
            </div>
            <div class="venta-table-container">
                <table>
                    <thead>
                        <tr class="sm">
                            <th>Producto</th>
                            <th class="text-right">Cantidad</th>
                            <th class="text-right">Precio</th>
                            <th class="text-right">IVA</th>
                            <th class="text-right">Subtotal</th>
                            <th style="text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="detalleBody">
                        <tr class="sm">
                            <td colspan="6">
                                <div class="empty-detail">
                                    <div>
                                        <i class="fa-solid fa-receipt"></i>
                                        <p>Agrega productos para iniciar la venta</p>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="venta-card-footer">
            <div class="venta-footer-totales">
                <div class="venta-footer-total-item">
                    <span>IVA 5%</span>
                    <strong id="iva5">0</strong>
                </div>
                <div class="venta-footer-total-item">
                    <span>IVA 10%</span>
                    <strong id="iva10">0</strong>
                </div>
                <div class="venta-footer-total-item venta-footer-total-general">
                    <span>Total</span>
                    <strong id="totalVenta">0</strong>
                </div>
            </div>
            <div class="venta-footer-actions">
                <button type="button" id="btnCancel" class="btn btn-secondary">Cancelar</button>
                <button type="submit" id="btnGuardar" class="btn btn-primary">Guardar</button>
            </div>
        </section>

        <div id="cobroModal" class="modal">
            <div class="modal-content modal-content-cobro">
                <div class="modal-header">
                    <h2 class="tituloform">Cobro de Factura</h2>
                    <button type="button" id="btnCloseCobroModal" class="modal-close">×</button>
                </div>
                <div class="modal-body">
                    <div class="cobro-resumen">
                        <div class="cobro-resumen-item">
                            <span>Cliente</span>
                            <strong id="cobroCliente">-</strong>
                        </div>
                        <div class="cobro-resumen-item">
                            <span>Comprobante</span>
                            <strong id="cobroComprobante">-</strong>
                        </div>
                        <div class="cobro-resumen-item cobro-resumen-total">
                            <span>Total a cobrar</span>
                            <strong id="cobroTotal">0</strong>
                        </div>
                    </div>

                    <form id="cobroForm">
                        <div class="row mb-2">
                            <div class="col-4">
                                <label for="formaPago">Forma de pago *</label>
                                <select id="formaPago" class="form-select input-estilizado" data-required="true">
                                    <option value="EFECTIVO">Efectivo</option>
                                    <option value="TARJETA">Tarjeta</option>
                                    <option value="TRANSFERENCIA">Transferencia</option>
                                    <option value="CREDITO">Crédito</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <label for="montoRecibido">Monto recibido *</label>
                                <input type="text" id="montoRecibido" class="form-control input-estilizado" data-importe autocomplete="off" data-required="true">
                            </div>
                            <div class="col-4">
                                <label for="vuelto">Vuelto</label>
                                <input type="text" id="vuelto" class="form-control input-estilizado" readonly>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-12">
                                <label for="observacionCobro">Observación</label>
                                <textarea id="observacionCobro" class="form-control input-estilizado" rows="3" placeholder="Detalle del cobro, referencia o nota interna"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="btnCancelCobro" class="btn btn-secondary">Cancelar</button>
                    <button type="button" id="btnConfirmarCobro" class="btn btn-primary">Confirmar cobro</button>
                </div>
            </div>
        </div>

        <div id="creditoModal" class="modal">
            <div class="modal-content modal-content-cobro">
                <div class="modal-header">
                    <h2 class="tituloform">Condiciones de Crédito</h2>
                    <button type="button" id="btnCloseCreditoModal" class="modal-close">×</button>
                </div>
                <div class="modal-body">
                    <div class="cobro-resumen">
                        <div class="cobro-resumen-item">
                            <span>Cliente</span>
                            <strong id="creditoCliente">-</strong>
                        </div>
                        <div class="cobro-resumen-item">
                            <span>Comprobante</span>
                            <strong id="creditoComprobante">-</strong>
                        </div>
                        <div class="cobro-resumen-item cobro-resumen-total">
                            <span>Total de la factura</span>
                            <strong id="creditoTotal">0</strong>
                        </div>
                    </div>

                    <form id="creditoForm">
                        <div class="row mb-2">
                            <div class="col-4">
                                <label for="cantidadCuotas">Cantidad de cuotas *</label>
                                <input type="number" id="cantidadCuotas" class="form-control input-estilizado" min="1" step="1" data-required="true" autocomplete="off">
                            </div>
                            <div class="col-4">
                                <label for="entregaInicial">Entrega inicial</label>
                                <input type="text" id="entregaInicial" class="form-control input-estilizado" data-importe autocomplete="off">
                            </div>
                            <div class="col-4">
                                <label for="saldoFinanciado">Saldo financiado</label>
                                <input type="text" id="saldoFinanciado" class="form-control input-estilizado" readonly>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-12">
                                <label for="observacionCredito">Observación</label>
                                <textarea id="observacionCredito" class="form-control input-estilizado" rows="3" placeholder="Acuerdo de cuotas, vencimiento o nota interna"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="btnCancelCredito" class="btn btn-secondary">Cancelar</button>
                    <button type="button" id="btnConfirmarCredito" class="btn btn-primary">Confirmar crédito</button>
                </div>
            </div>
        </div>
        
    </div>

    <script type="module" src="./venta.js"></script>
</body>
