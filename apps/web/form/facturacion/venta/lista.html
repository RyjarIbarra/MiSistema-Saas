<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../../assets/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <title>Lista de Facturas - Mi Sistema</title>
</head>
<body>
    <div class="contenedor">
        <nav id="breadcrumb" class="breadcrumb"></nav>

        <div class="table-card">
            <div class="table-header">
                <h3>Lista de Facturas</h3>
                <div class="table-header-actions">
                    <input type="text" class="form-control input-estilizado" placeholder="Buscar por cliente, RUC o comprobante..." autocomplete="off" id="searchInput">
                    <button type="button" class="btn-primary" id="btnNuevaFactura">
                        <i class="fa-solid fa-plus"></i> Nueva Factura
                    </button>
                </div>
            </div>

            <div class="table-container factura-table-container">
                <table>
                    <thead>
                        <tr class="sm">
                            <th>Fecha</th>
                            <th>Comprobante</th>
                            <th>Timbrado</th>
                            <th>RUC/CI</th>
                            <th>Cliente</th>
                            <th>Condición</th>
                            <th>Moneda</th>
                            <th class="text-end">Total</th>
                            <th>Estado</th>
                            <th style="text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaFacturas"></tbody>
                </table>
            </div>

            <div class="pagination pagination-productos">
                <div class="pagination-total" id="pageinfo">
                    Total registros 0
                </div>
                <div class="pagination-buttons pagination-buttons-productos" id="facturaPagination">
                    <button type="button" id="btnpagPrimero" class="pagination-nav" aria-label="Primera página">
                        <i class="fa-solid fa-angles-left"></i>
                    </button>
                    <button type="button" id="btnpagAnterior" class="pagination-nav" aria-label="Página anterior">
                        <i class="fa-solid fa-angle-left"></i>
                    </button>
                    <div id="facturaPaginationPages" class="pagination-pages"></div>
                    <button type="button" id="btnpagSiguiente" class="pagination-nav" aria-label="Página siguiente">
                        <i class="fa-solid fa-angle-right"></i>
                    </button>
                    <button type="button" id="btnpagUltimo" class="pagination-nav" aria-label="Última página">
                        <i class="fa-solid fa-angles-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./lista.js"></script>
</body>
</html>
