<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../../assets/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <title>Historial - Mi Sistema</title>
</head>
<body>
    <div class="contenedor">
        <nav id="breadcrumb" class="breadcrumb"></nav>

        <div class="table-card">
            <div class="table-header">
                <h3>Historial del Sistema</h3>
                <div class="table-header-actions">
                    <input type="date" id="histFecha" class="form-control input-estilizado">
                    <input type="text" id="textoBuscar" class="form-control input-estilizado" placeholder="Buscar">
                    <select id="histUsuario" class="form-select input-estilizado">
                        <option value="">Todos los usuarios</option>
                    </select>
                    <select id="histModulo" class="form-select input-estilizado">
                        <option value="">Todos los modulos</option>
                    </select>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr class="sm">
                            <th>Fecha</th>
                            <th>Usuario</th>
                            <th>Modulo</th>
                            <th>Operacion</th>
                            <th>Detalle</th>
                        </tr>
                    </thead>
                    <tbody id="historialTableBody">
                        <tr class="sm">
                            <td>1</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <div id="pageinfo" class="pagination-info">Mostrando 0 de 0 registros</div>
            </div>
        </div>
    </div>

    <script type="module" src="./historial.js"></script>
</body>
</html>
