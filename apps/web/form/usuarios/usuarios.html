<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="icon" href="../../assets/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">      
    <title>Usuarios - Mi Sistema</title>
</head>
<body>
    <div class="contenedor">
        
        <!-- Breadcrumb -->
        <nav id="breadcrumb" class="breadcrumb"></nav>

        <!-- Tabla de usuarios -->
        <div class="table-card">    

            <div class="table-header">
                <h3>Usuarios del Sistema</h3>
                <div class="table-header-actions">
                    <input type="text" class="form-control input-estilizado" placeholder="Buscar por Usuario o Email..." autocomplete="off" id="searchInput">
                    <button type="button" class="btn-primary" id="btnNewUser">
                        <i class="fa-solid fa-plus"></i> Nuevo Usuario
                    </button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr class="sm">
                            <th>ID</th>                            
                            <th>Usuario</th>
                            <th>Email</th>
                            <th>Perfil</th>
                            <th>Estado</th>
                            <th style="text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                        <tr class="sm">
                            <td>1</td>
                        </tr>                        
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <div id="pageinfo" class="pagination-info">
                    Mostrando 1 a 5 de 0 registros
                </div>
                <div class="pagination-buttons">
                    <button id="btnpagAnterior">Anterior</button>
                    <button id="pagActual" class="active no-cursor">1</button>
                    <button class="no-cursor" style="border: none">...</button>
                    <button id="totalPage">1</button>
                    <button id="btnpagSiguiente">Siguiente</button>
                </div>
            </div>

        </div>

        <!-- Modal Usuario -->
        <div id="userModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle" class="tituloform">Nuevo Usuario</h2>
                    <button type="button" id="btnCloseModal" class="modal-close">×</button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <div class="row mb-2">
                            <div class="col-6">
                                <label for="usuario">Usuario *</label>
                                <input type="text" id="usuario" class="form-control input-estilizado" placeholder="Juan Perez" autocomplete="off" data-required="true">
                            </div>
                            <div class="col-6">
                                <label for="email">Email *</label>
                                <input type="email" id="email" class="form-control input-estilizado" placeholder="correo@ejemplo.com" autocomplete="off" data-required="true">
                            </div>                            
                        </div>
                        <div class="row mb-2">                            
                            <div class="col-6">
                                <label for="perfil">Nivel de Acceso *</label>
                                <select id="perfil" class="form-select input-estilizado" data-required="true">
                                    <option value="">Seleccionar...</option>
                                    <option value="0">Titular</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label for="activo">Estado</label>
                                <select id="activo" class="form-select input-estilizado">
                                    <option value="true">Activo</option>
                                    <option value="false">Bloqueado</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6">
                                <label for="password">Contraseña *</label>
                                <input type="password" id="password" class="form-control input-estilizado" placeholder="••••••••" autocomplete="new-password" data-required="true">
                            </div>
                            <div class="col-6">
                                <label for="confirmPassword">Confirmar Contraseña *</label>
                                <input type="password" id="confirmPassword" class="form-control input-estilizado" placeholder="••••••••" autocomplete="new-password" data-required="true">
                            </div>
                        </div>                        
                        <div class="row mb-2">
                            <div class="col-12">
                                <label for="telefono">Telefono</label>
                                <input type="text" id="telefono" class="form-control input-estilizado" autocomplete="off" placeholder="Telefono de contacto">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="btnCancel" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" id="btnGuardar" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>

    </div>
    <script type="module" src="./usuario.js"></script>
</body>
</html>
