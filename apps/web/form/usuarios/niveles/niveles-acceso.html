<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../../assets/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/style.css">
    <title>Niveles de Acceso - Mi Sistema</title>
</head>
<body>
    <div class="contenedor">
        <nav id="breadcrumb" class="breadcrumb"></nav>

        <div class="table-card">
            <div class="table-header">
                <h3>Niveles de Acceso</h3>
                <div class="table-header-actions">
                    <input type="text" class="form-control input-estilizado" placeholder="Buscar por nombre o descripción..." autocomplete="off" id="searchInput">
                    <button type="button" class="btn-primary" id="btnNewLevel">
                        <i class="fa-solid fa-plus"></i> Nuevo Nivel
                    </button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr class="sm">
                            <th>ID</th>
                            <th>Nivel</th>
                            <th>Descripción</th>
                            <!-- <th>Opciones</th>
                            <th>Permisos activos</th> -->
                            <th>Estado</th>
                            <th style="text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaNiveles">
                        <tr class="sm">
                            <td>1</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="accessLevelModal" class="modal">
            <div class="modal-content-vw vw-90">

                <div class="modal-header d-none">
                    <h2 id="modalTitle" class="tituloform">Nuevo Nivel de Acceso</h2>
                    <button type="button" id="btnCloseModal" class="modal-close">×</button>
                </div>

                <div class="modal-body">
                    <form id="accessLevelForm">
                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-4">
                                <label for="nivelNombre" class="form-label">Nivel *</label>
                                <input type="text" id="nivelNombre" class="form-control input-estilizado" placeholder="Ej: Supervisor de Ventas" autocomplete="off" data-required="true">
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="nivelDescripcion" class="form-label">Descripción</label>
                                <input type="text" id="nivelDescripcion" class="form-control input-estilizado" placeholder="Detalle breve del alcance del nivel" autocomplete="off">
                            </div>
                            <div class="col-12 col-md-2">
                                <label for="nivelActivo" class="form-label">Estado</label>
                                <select id="nivelActivo" class="form-select input-estilizado">
                                    <option value="true">Activo</option>
                                    <option value="false">Inactivo</option>
                                </select>
                            </div>
                        </div>
                    </form>

                    <div class="access-toolbar">
                        <div class="access-toolbar-search">
                            <label for="permissionSearch" class="form-label">Opciones del sistema</label>
                            <input type="text" id="permissionSearch" class="form-control input-estilizado" placeholder="Filtrar por módulo u opción..." autocomplete="off">
                        </div>
                        <div class="access-toolbar-actions">
                            <button type="button" class="btn-outline-primary-soft" data-bulk-action="view">Vista todos</button>
                            <button type="button" class="btn-outline-primary-soft" data-bulk-action="create">Guardar todos</button>
                            <button type="button" class="btn-outline-primary-soft" data-bulk-action="update">Modificar todos</button>
                            <button type="button" class="btn-outline-primary-soft" data-bulk-action="delete">Eliminar todos</button>
                        </div>
                    </div>

                    <div class="permission-summary d-none" id="permissionSummary"></div>

                    <div class="table-config-card access-matrix-card">
                        <div class="table-container table-container-permissions">
                            <table>
                                <thead>
                                    <tr class="sm">
                                        <th>Módulo</th>
                                        <th>Opción</th>
                                        <th class="center">Vista</th>
                                        <th class="center">Guardar</th>
                                        <th class="center">Modificar</th>
                                        <th class="center">Eliminar</th>
                                    </tr>
                                </thead>
                                <tbody id="permissionsTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" id="btnCancel" class="btn btn-secondary">Cancelar</button>
                    <button type="button" id="btnGuardar" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./niveles-acceso.js"></script>
</body>
</html>
