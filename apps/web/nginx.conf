server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- front estatico ---
    location / {
        try_files $uri $uri/ =404;
    }

    # el HTML nunca se cachea
    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }

    # css/js/img si, agresivo (versionar con ?v=2 al cambiarlos)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- backend principal (api) ---
    # context-path del backend = /pdv. proxy_pass sin barra final -> pasa la URI tal cual:
    #   /pdv/clientes -> api:9095/pdv/clientes
    location /pdv/ {
        proxy_pass http://api:9095;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Alias /api/ -> mismo backend, reescribiendo al context-path /pdv.
    # Cubre la llamada de cambiarPassword.js (fetch('/api/auth/change-password')).
    #   /api/auth/change-password -> api:9095/pdv/auth/change-password
    location /api/ {
        proxy_pass http://api:9095/pdv/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- backend de reportes ---
    #   /report/producto/... -> reports:9096/report/producto/...
    location /report/ {
        proxy_pass http://reports:9096;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # generar un PDF tarda
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;

        # que el PDF salga fluyendo
        proxy_buffering off;
    }
}
